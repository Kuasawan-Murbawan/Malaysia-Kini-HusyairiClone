@if (story(); as s) {
  <article class="news-card">
    <div class="news-card__image">
      <img [src]="s.image" [alt]="s.title" />
    </div>
    <div class="news-card__body">
      @if (s.category) {
        <span class="news-card__category">{{ s.category.name }}</span>
      }
      <h3 class="news-card__title">{{ s.title }}</h3>
      <p class="news-card__summary">{{ s.summary }}</p>
      <div class="news-card__meta">
        @if (s.author) {
          <span>{{ s.author }}</span>
          <span class="dot">•</span>
        }
        <span>{{ timeAgo(s.date_published) }}</span>
        @if (s.comment_count > 0) {
          <span class="dot">•</span>
          <span>💬 {{ s.comment_count }}</span>
        }
      </div>
    </div>
  </article>
}
